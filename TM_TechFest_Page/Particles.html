<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particles Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      overflow: hidden;
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    .content h1 {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #8b5cf6, #06b6d4, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
    }

    .content p {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      max-width: 600px;
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  
  <div class="content">
    <h1>Particles Background</h1>
    <p>A beautiful animated particles effect with neon colors and connecting lines. Move your mouse to see the particles in action!</p>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');

      if (!canvas || !ctx) {
        console.error('Canvas not supported');
        return;
      }

      let animationFrameId = null;
      let particles = [];

      // Particle class
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 1; // 1 to 3px
          this.speedX = Math.random() * 0.5 - 0.25; // Slow movement
          this.speedY = Math.random() * 0.5 - 0.25;
          // Neon colors: Violet, Cyan, Blue, Hot Pink
          const colors = ['#8b5cf6', '#06b6d4', '#3b82f6', '#d946ef'];
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.alpha = Math.random() * 0.5 + 0.2;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          // Wrap around screen
          if (this.x > canvas.width) this.x = 0;
          if (this.x < 0) this.x = canvas.width;
          if (this.y > canvas.height) this.y = 0;
          if (this.y < 0) this.y = canvas.height;
        }

        draw() {
          ctx.globalAlpha = this.alpha;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          // Glow effect
          ctx.shadowBlur = 15;
          ctx.shadowColor = this.color;
          ctx.fill();
          ctx.shadowBlur = 0; // Reset
          ctx.globalAlpha = 1.0;
        }
      }

      // Initialize particles
      function initParticles() {
        particles = [];
        const particleCount = Math.min(Math.floor(window.innerWidth / 15), 100); // Responsive count
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
      }

      // Set canvas size
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initParticles();
      }

      // Animation loop
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Update and draw particles
        particles.forEach(p => {
          p.update();
          p.draw();
        });

        // Draw connecting lines if close
        particles.forEach((a, index) => {
          for (let j = index + 1; j < particles.length; j++) {
            const b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 100) {
              ctx.beginPath();
              ctx.strokeStyle = 'rgba(139, 92, 246, ' + (0.1 * (1 - distance / 100)) + ')'; // Violet tint
              ctx.lineWidth = 1;
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        });

        animationFrameId = requestAnimationFrame(animate);
      }

      // Event listeners
      window.addEventListener('resize', resize);

      // Initialize
      resize();
      animate();

      // Cleanup function (for SPA frameworks or manual cleanup)
      window.cleanupParticles = function() {
        window.removeEventListener('resize', resize);
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }
      };
    })();
  </script>
</body>
</html>
